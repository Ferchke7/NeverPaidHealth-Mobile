name: Build & Release NeverPaidHealth Mobile (APK & iOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: 🔨 Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: 📦 Prepare APK Artifact
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find composeApp/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-artifacts/NeverPaidHealth-v1.0.0-debug.apk
            echo "Copied $APK_FILE to build-artifacts/NeverPaidHealth-v1.0.0-debug.apk"
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: ⬆️ Upload APK to GitHub Actions Artifacts (Immediate Download)
        uses: actions/upload-artifact@v4
        with:
          name: NeverPaidHealth-Android-APK
          path: build-artifacts/NeverPaidHealth-v1.0.0-debug.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release & Publish APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}
          name: "NeverPaidHealth Mobile Release ${{ github.event.inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build-artifacts/NeverPaidHealth-v1.0.0-debug.apk

  build-ios:
    name: 🍏 Validate iOS Build (macOS)
    runs-on: macos-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Make gradlew executable
        run: chmod +x ./gradlew

      - name: 🔨 Compile iOS Framework (Simulator Arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
